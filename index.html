<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Prevail</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo-512.png" />
    <!-- Installable web app (iOS "Add to Home Screen", Android "Install app").
         The WebUI serves this exact bundle over Tailscale, so a phone gets the
         real app as a standalone, full-screen app with no native build. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0d1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prevail" />
    <!-- Pre-bundle error net (external so CSP keeps script-src 'self'). -->
    <script src="/boot-errors.js"></script>
    <!-- Self-hosted fonts (local-first: no runtime request to Google on launch).
         woff2 bundled under public/fonts; latin + latin-ext subsets. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
